# Which Udea to build against. Every engine coordinate and every engine plugin in this
# repository takes its version from here, so this one line is the whole of "which engine".
#
# Udea has no release yet, so this is a snapshot - but it is a *pinned* snapshot, and that is the
# point. A game does not follow the engine's tip: the number below changes when the owner says a
# new snapshot is the one to build against, and not before. Between those moments the engine can
# move as much as it likes and this game keeps building the same thing.
#
# `settings.gradle.kts` resolves it from `mavenLocal()` first and then from Central's snapshot
# repository, so it works whether the engine was published by the Release workflow or by
# `./gradlew publishToMavenLocal` (and `./gradlew -p build-logic publishToMavenLocal`) in a
# checkout of your own.
#
# Gradle keeps a snapshot it has already resolved for 24 hours. See "Getting a newer engine" in
# the engine's `docs/new-game.md`.
udeaVersion=0.1.0-SNAPSHOT

# The Kotlin compiler and KSP run in the Gradle worker JVM, and KSP2 holds the Kotlin Analysis
# API in metaspace. These are the engine's own numbers; a cold build fails without them.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

org.gradle.caching=true
org.gradle.parallel=true
