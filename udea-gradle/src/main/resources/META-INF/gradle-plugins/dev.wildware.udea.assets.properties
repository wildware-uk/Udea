# The plugin id `dev.wildware.udea.assets`: the build-time asset pipeline of spec 3.6.
#
# Written by hand for the reason `dev.wildware.udea.agent.properties` gives: `java-gradle-plugin`
# would put `gradleApi()` on the `api` configuration and the whole Gradle API would then be
# reachable from a consumer's runtime classpath, which is the defect the old `gradle-plugin`
# module shipped.
#
# `build-logic` compiles the same source and declares the same id through `gradlePlugin {}`, which
# is what lets THIS build apply it to `:moba`; a subproject's plugin cannot be applied to a sibling
# subproject of the same build. `UdeaAgentPluginIdTest` asserts the two declarations agree.
implementation-class=dev.wildware.udea.gradle.UdeaAssetsPlugin
