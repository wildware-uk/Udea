[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
libgdx = "1.13.1"

# plugins
changelog = "2.2.1"
intelliJPlatform = "2.5.0"
kotlin = "2.4.20"
kover = "0.9.1"
qodana = "2024.3.4"
junitJupiter = "5.8.1"

# --- udea-* rewrite (Phase 0). Every new module takes its versions from here. ---
# `kotlin` above is the single authoritative Kotlin version: udea-compiler-plugin and
# udea-assets-compiler are pinned to it exactly (spec 7), and build-logic's
# UdeaVersions.KOTLIN is asserted equal to it by a test.
# It does NOT by itself control the kotlin-stdlib that resolves: Gradle takes the highest
# requested version, and kotlinpoet and fleks below each request a newer one. Modules on
# the `udea.kotlin-build-tool` convention - the jars loaded inside the compiler - pin the
# resolved stdlib back to `kotlin` and prove it with `udeaVerifyKotlinPin`. Everything
# else deliberately takes the higher stdlib, which is the supported direction.
#
# KSP has left the `<kotlin>-<ksp>` versioning scheme, so this entry's *shape* changed with the
# 2.4.20 move and not just its number. `2.2.21-2.0.5` was the last release on the old scheme;
# from `2.3.0` onwards KSP publishes a single version of its own and no longer names a compiler
# in it. That is deliberate on KSP's side: KSP2 talks to the Kotlin Analysis API rather than to
# the compiler frontend, so it is no longer built once per Kotlin release.
#
# The consequence for this repository is that `UdeaVersions.KOTLIN` can no longer be checked
# against this string, and `UdeaVersionsTest` no longer pretends it can - see `KspVersionRule`
# for what is still checkable and where the executable proof lives instead.
ksp = "2.3.12"
kotlinpoet = "2.3.0"
# The Fleks release `udea-fleks` vendors as source (issue #215), not a version anything downloads
# for the engine. `udeaVerifyDeterminism` stamps it, with a digest of the vendored source, as the
# version `determinism-audit.md` describes; change it only when re-vendoring.
fleks = "2.14"
# libGDX. Moved 1.13.5 -> 1.14.2 with the ComposeGL move (issue #186), and not for its own
# sake: `composegl-gdx:0.5.0` depends on `com.badlogicgames.gdx:gdx:1.14.2`, so Gradle upgraded
# `gdx` to 1.14.2 on `udea-render` and `moba` while `gdx-backend-lwjgl3` and the
# `gdx-platform`/`gdx-box2d-platform` **native** loaders stayed on 1.13.5 from this entry. A gdx
# core at one version and its desktop natives at another is the skew that fails inside
# `Lwjgl3Application`'s own constructor, and it would have been invisible: `:udea-render:dependencies`
# printed `gdx:1.13.5 -> 1.14.2` while this file still said 1.13.5. One version here keeps core,
# backend, natives and box2d on the same release and leaves `composegl-gdx` with nothing to upgrade.
gdx = "1.14.2"
junit5 = "5.13.4"
# ASM is a build/test-time class-file reader: udea-render's udeaVerifyHeadless scans the
# compiled bytecode of the headless modules for GL references, and udeaVerifyDeterminism
# (Phase 7) will share the same visitor. Never a runtime dependency of a shipped module.
asm = "9.6"
junitPlatform = "1.13.4"
# ComposeGL: the Compose-based UI toolkit that replaces scene2d (issues #185-#189). Every
# published release declares `kotlin-stdlib:2.4.20` and its jars carry `@Metadata(mv = [2, 4, 0])`,
# which is why `kotlin` above had to move to 2.4.20 before any of this could be on the classpath
# at all. `composegl-gdx` is a GL backend, so it is `udea-render`-only by UDEA-MG-002.
#
# 0.7.0-SNAPSHOT is the first release carrying `composegl-kool`, the Kool frontend `udea-render`
# hosts its interface on (issue #224). A snapshot rather than a release because there is no 0.7.0
# yet. Every composegl artifact moves together: `composegl-kool:0.7.0-SNAPSHOT` declares
# `composegl-ui` and `composegl-render` at the same version, and a mixed graph would not link.
#
# `udea-render` needs a snapshot built from ComposeGL `007ea1cf` or later (issue #227): that is the
# one carrying `ComposeGlScene.onPointerUsed`, published 2026-09-18 as `0.7.0-20260918.215548-*`.
# Gradle keeps a snapshot it has already resolved for 24 hours, so a machine that fetched an older
# one that day builds `udea-render` red until `--refresh-dependencies` is run once. Not pinned to the
# timestamp: each artifact of one publish carries its own build number (`-3` on the JVM jar, `-2` on
# the Android one), so no single version names them all, and a snapshot repository purges old ones.
composegl = "0.7.0-SNAPSHOT"
# kotlinx.serialization, for level files (issue #191): a saved level is Fleks' own
# `world.snapshot()` encoded as CBOR. 1.11.0 is the version the Fleks 2.14 release was built and
# tested against. Fleks is vendored source since issue #215 and compiles its `@Serializable`
# `Snapshot` and `Entity` against this entry, so moving it moves what `udea-fleks`' own tests run on.
# Runtime snapshots - rewind, replication, desync reports - stay on `Replicator<T>`; AGENTS.md.
kotlinxSerialization = "1.11.0"
# The Android Gradle Plugin, for its Kotlin Multiplatform library support
# (`com.android.kotlin.multiplatform.library`), which is how a runtime module gets its Android
# target (issue #201, spec section 3). 8.13.x is the newest line Gradle 8.13 runs: AGP 9 needs
# Gradle 9. Build-logic only - it is on `build-logic`'s classpath and no module's.
agp = "8.13.2"
# The Android API levels every multiplatform runtime module compiles against and runs on.
# `androidCompileSdk` is the newest platform installed in the development box's SDK.
# `androidMinSdk` 26 (Android 8.0) is forced by a dependency: `composegl-kool-android`, which
# `udea-render` takes for its interface host (issue #224), declares minSdk 26 in its manifest, and
# the first Android *application* to resolve it - `:moba:android`, issue #212 - fails its manifest
# merge below that. It was 24, a floor issue #201 chose with nothing forcing it. Raised here, once,
# for every module rather than for the app alone, because every module that ships on Android
# ships inside an app that resolves `udea-render`.
androidCompileSdk = "36"
androidMinSdk = "26"
# atomicfu: the multiplatform lock `udea-core` guards the one queue other threads write to, the
# `SimBarrier` inbox (issue #203, spec section 6: "`java.util.concurrent` is replaced by coroutines,
# and by `atomicfu` where state is genuinely shared"). Only its `locks` API is used, which is an
# ordinary class on every target, so no atomicfu compiler plugin is applied.
atomicfu = "0.33.0"
# udea-net's transports on Kotlin Multiplatform (issue #209, spec section 6 and D11). Ktor gives UDP
# sockets on the socket-capable targets (`ktor-network`), a WebSocket client on every target
# (`ktor-client-*`) and the desktop server's WebSocket endpoint (`ktor-server-*`). 3.6.0 is built
# against coroutines 1.11.0, which is therefore the `kotlinxCoroutines` entry: a lower one would be
# upgraded to it by resolution and this file would say something untrue.
ktor = "3.6.0"
kotlinxCoroutines = "1.11.0"
# The connect-token HMAC, off `javax.crypto` (issue #209). The JDK provider by name, on the JVM and
# Android, rather than the library's default-provider lookup, which on the JVM is a `ServiceLoader`.
cryptography = "0.6.0"

# Kool: the renderer `udea-render` draws with (spec section 4, issue #211). 0.19.0 is the release the
# #200 spike proved under xvfb on llvmpipe and the one `composegl-kool` builds against. It has no
# wasmJs artifact (issue #223), so `udea-render` builds for `jvm` and `android` only until one
# exists. `udea-render` only: UDEA-MG-002 bans `de.fabmax.kool:*` from every headless module.
kool = "0.19.0"

# kotlinx-io: how `udea-assets` reads a `.udeapak` from a file on every target (issue #205, spec
# section 6: "kotlinx-io everywhere; on Wasm, a 'file' is an HTTP fetch or an in-memory buffer").
kotlinxIo = "0.9.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }

# --- udea-* rewrite ---
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
# The scripting host, pinned to `kotlin` for the same reason the compiler is: the host loads
# classes the embedded compiler produced, so a version skew is a class-load failure inside a
# Gradle worker rather than a compile error. Build-time only - UDEA-MG-005 bans every one of
# these from moba's runtime classpath, which is the whole point of moving evaluation to the build.
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable", version.ref = "kotlin" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
# The old tree's Fleks, from Maven. Only `common` names it: every `udea-*` module has Fleks' source
# through `udea-fleks` (issue #215), and this entry goes when `common` does.
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks" }
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
# The gdx desktop native library (gdx64.dll / libgdx64.so / libgdx64.dylib). Consumed with a
# `natives-desktop` classifier, which a version catalog cannot express, so udea-render asks
# for the variant explicitly. Runtime-only and udea-render-only: it is a native loader, and
# UDEA-MG-002 bans `com.badlogicgames.gdx:*-platform` from every headless module for exactly
# that reason.
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
# FreeType's desktop natives. `composegl-gdx` brings the Java binding (`gdx-freetype`)
# transitively and not this, so a game that registers a `.ttf` through `GdxFonts` needs it
# selected here; `udea-render/build.gradle.kts` says why at the call site. A `*-platform`
# artifact, so UDEA-MG-002 keeps it out of every headless module.
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
# Box2D. `gdx-box2d` is the Java binding and is headless in the sense UDEA-MG-002 cares about -
# it names no GL type - but it is useless without `gdx-box2d-platform`, which is a
# `*-platform` native loader and therefore banned from every designated headless module. Both are
# consumed by `:moba`, which is a game and not one of those modules.
gdx-box2d = { module = "com.badlogicgames.gdx:gdx-box2d", version.ref = "gdx" }
gdx-box2d-platform = { module = "com.badlogicgames.gdx:gdx-box2d-platform", version.ref = "gdx" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
# The toolkit: nodes, modifiers, layout, widgets, input, and `HeadlessBackend`/`uiTest`, which is
# how a composable is composed and asserted on with no window (see ComposeGlLinkTest).
composegl-ui = { module = "dev.wildware.composegl:composegl-ui", version.ref = "composegl" }
# The libGDX backend: it draws a ComposeGL tree through a gdx `Batch`, so it names GL types and
# may only ever be a dependency of `udea-render`.
composegl-gdx = { module = "dev.wildware.composegl:composegl-gdx", version.ref = "composegl" }
# The Kool backend: it draws a ComposeGL tree inside Kool's frame, through Kool's own GL context,
# so like every other frontend it may only ever be a dependency of `udea-render` (UDEA-MG-002).
composegl-kool = { module = "dev.wildware.composegl:composegl-kool", version.ref = "composegl" }
# Desktop glyph rasterisation (stb_truetype, through LWJGL). A frontend artifact, `udea-render`-only
# and JVM-only: Android rasterises with its own `Typeface`, inside `composegl-kool`.
composegl-lwjgl3 = { module = "dev.wildware.composegl:composegl-lwjgl3", version.ref = "composegl" }
# Kool's multiplatform core. Gradle's variant matching picks `kool-core-desktop` for the JVM
# target and `kool-core-android` for the Android one.
kool-core = { module = "de.fabmax.kool:kool-core", version.ref = "kool" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
# Test-only: `udea-fleks` runs upstream Fleks' own tests, which encode a snapshot to JSON.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
# udea-net's transports (issue #209).
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler plugin. `version.ref = "kotlin"` is not a convenience: since Kotlin 2.0
# this plugin ships out of the Kotlin repository and is released in lockstep with the compiler,
# so any other version is a version that cannot load. Applied to `udea-render` only.
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# The kotlinx.serialization compiler plugin. Like `composeCompiler` it ships out of the Kotlin
# repository in lockstep with the compiler, so `version.ref = "kotlin"` is the only version that
# loads. Applied to the modules whose components a level file saves: udea-core, udea-gas, moba.
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
