[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
libgdx = "1.13.1"

# plugins
changelog = "2.2.1"
intelliJPlatform = "2.5.0"
kotlin = "2.4.20"
kover = "0.9.1"
qodana = "2024.3.4"
junitJupiter = "5.8.1"

# --- udea-* rewrite (Phase 0). Every new module takes its versions from here. ---
# `kotlin` above is the single authoritative Kotlin version: udea-compiler-plugin and
# udea-assets-compiler are pinned to it exactly (spec 7), and build-logic's
# UdeaVersions.KOTLIN is asserted equal to it by a test.
# It does NOT by itself control the kotlin-stdlib that resolves: Gradle takes the highest
# requested version, and kotlinpoet and fleks below each request a newer one. Modules on
# the `udea.kotlin-build-tool` convention - the jars loaded inside the compiler - pin the
# resolved stdlib back to `kotlin` and prove it with `udeaVerifyKotlinPin`. Everything
# else deliberately takes the higher stdlib, which is the supported direction.
#
# KSP has left the `<kotlin>-<ksp>` versioning scheme, so this entry's *shape* changed with the
# 2.4.20 move and not just its number. `2.2.21-2.0.5` was the last release on the old scheme;
# from `2.3.0` onwards KSP publishes a single version of its own and no longer names a compiler
# in it. That is deliberate on KSP's side: KSP2 talks to the Kotlin Analysis API rather than to
# the compiler frontend, so it is no longer built once per Kotlin release.
#
# The consequence for this repository is that `UdeaVersions.KOTLIN` can no longer be checked
# against this string, and `UdeaVersionsTest` no longer pretends it can - see `KspVersionRule`
# for what is still checkable and where the executable proof lives instead.
ksp = "2.3.12"
kotlinpoet = "2.3.0"
fleks = "2.14"
# libGDX. Moved 1.13.5 -> 1.14.2 with the ComposeGL move (issue #186), and not for its own
# sake: `composegl-gdx:0.5.0` depends on `com.badlogicgames.gdx:gdx:1.14.2`, so Gradle upgraded
# `gdx` to 1.14.2 on `udea-render` and `moba` while `gdx-backend-lwjgl3` and the
# `gdx-platform`/`gdx-box2d-platform` **native** loaders stayed on 1.13.5 from this entry. A gdx
# core at one version and its desktop natives at another is the skew that fails inside
# `Lwjgl3Application`'s own constructor, and it would have been invisible: `:udea-render:dependencies`
# printed `gdx:1.13.5 -> 1.14.2` while this file still said 1.13.5. One version here keeps core,
# backend, natives and box2d on the same release and leaves `composegl-gdx` with nothing to upgrade.
gdx = "1.14.2"
junit5 = "5.13.4"
# ASM is a build/test-time class-file reader: udea-render's udeaVerifyHeadless scans the
# compiled bytecode of the headless modules for GL references, and udeaVerifyDeterminism
# (Phase 7) will share the same visitor. Never a runtime dependency of a shipped module.
asm = "9.6"
junitPlatform = "1.13.4"
# ComposeGL: the Compose-based UI toolkit that replaces scene2d (issues #185-#189). Every
# published release declares `kotlin-stdlib:2.4.20` and its jars carry `@Metadata(mv = [2, 4, 0])`,
# which is why `kotlin` above had to move to 2.4.20 before any of this could be on the classpath
# at all. `composegl-gdx` is a GL backend, so it is `udea-render`-only by UDEA-MG-002.
#
# TEMPORARY: A SNAPSHOT, AND ONE OF THE TWO PLACES THAT SAY SO.
# 0.6.0 is what `UiLayer` is written against (issue #187) and it is not on Maven Central yet, so
# it resolves from `https://central.sonatype.com/repository/maven-snapshots`, declared in the root
# `build.gradle.kts` `allprojects { repositories { ... } }` block -- the other of the two places.
#
# When 0.6.0 releases on Central, the whole move is: change this line to `composegl = "0.6.0"`
# and delete that one `maven(...)` line. This is the only `-SNAPSHOT` version in this catalogue,
# so `grep -n SNAPSHOT gradle/libs.versions.toml` is the check that the swap is complete.
#
# Read the next sentence before deleting anything else. The `allprojects` block also declares two
# `oss.sonatype.org/content/repositories/snapshots` repositories. They are **not** part of this,
# they predate it by a long way (they are in `19403f3`, the initial commit), and they must stay.
composegl = "0.6.0-SNAPSHOT"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }

# --- udea-* rewrite ---
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
# The scripting host, pinned to `kotlin` for the same reason the compiler is: the host loads
# classes the embedded compiler produced, so a version skew is a class-load failure inside a
# Gradle worker rather than a compile error. Build-time only - UDEA-MG-005 bans every one of
# these from moba's runtime classpath, which is the whole point of moving evaluation to the build.
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable", version.ref = "kotlin" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks" }
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
# The gdx desktop native library (gdx64.dll / libgdx64.so / libgdx64.dylib). Consumed with a
# `natives-desktop` classifier, which a version catalog cannot express, so udea-render asks
# for the variant explicitly. Runtime-only and udea-render-only: it is a native loader, and
# UDEA-MG-002 bans `com.badlogicgames.gdx:*-platform` from every headless module for exactly
# that reason.
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
# FreeType's desktop natives. `composegl-gdx` brings the Java binding (`gdx-freetype`)
# transitively and not this, so a game that registers a `.ttf` through `GdxFonts` needs it
# selected here; `udea-render/build.gradle.kts` says why at the call site. A `*-platform`
# artifact, so UDEA-MG-002 keeps it out of every headless module.
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
# Box2D. `gdx-box2d` is the Java binding and is headless in the sense UDEA-MG-002 cares about -
# it names no GL type - but it is useless without `gdx-box2d-platform`, which is a
# `*-platform` native loader and therefore banned from every designated headless module. Both are
# consumed by `:moba`, which is a game and not one of those modules.
gdx-box2d = { module = "com.badlogicgames.gdx:gdx-box2d", version.ref = "gdx" }
gdx-box2d-platform = { module = "com.badlogicgames.gdx:gdx-box2d-platform", version.ref = "gdx" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
# The toolkit: nodes, modifiers, layout, widgets, input, and `HeadlessBackend`/`uiTest`, which is
# how a composable is composed and asserted on with no window (see ComposeGlLinkTest).
composegl-ui = { module = "dev.wildware.composegl:composegl-ui", version.ref = "composegl" }
# The libGDX backend: it draws a ComposeGL tree through a gdx `Batch`, so it names GL types and
# may only ever be a dependency of `udea-render`.
composegl-gdx = { module = "dev.wildware.composegl:composegl-gdx", version.ref = "composegl" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler plugin. `version.ref = "kotlin"` is not a convenience: since Kotlin 2.0
# this plugin ships out of the Kotlin repository and is released in lockstep with the compiler,
# so any other version is a version that cannot load. Applied to `udea-render` only.
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
