pluginGroup = dev.wildware.udea
pluginName = udea-plugin
pluginRepositoryUrl = https://github.com/wildware-uk/udea
# SemVer format -> https://semver.org
pluginVersion = 0.0.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 242
pluginUntilBuild = 252.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformType = IC
platformVersion = 2025.1

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins = com.intellij.java, org.jetbrains.kotlin, com.intellij.modules.json

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 8.13

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = true

# Daemon memory, stated rather than inherited.
#
# KSP2 runs the Kotlin Analysis API *in the Gradle worker JVM* rather than forking a compiler,
# so `kspKotlin` loads the whole compiler frontend into metaspace and a long-lived daemon that
# has run it many times does not get that space back. Gradle's own default
# (`-Xmx512m -XX:MaxMetaspaceSize=384m`) is enough for one cold build and runs out during a
# development session -- observed as `java.lang.OutOfMemoryError: Metaspace` from
# `:common:kspKotlin` and `:udea-codegen:kspTestKotlin` on a daemon that had already served a
# dozen builds, and not reproducible on a fresh one.
#
# A build whose memory requirement is a Gradle default is a build that changes behaviour when
# Gradle changes that default, so it is written down here.
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# KSP incremental processing. ON, which it could not be while the old NetworkGenerator
# existed: it marked every generated file `Dependencies(aggregating = true)` and named its
# index `UdeaSerializerRegistry_${System.currentTimeMillis()}`, so every build reprocessed
# every component and produced a file that had never existed before. udea-codegen emits one
# ISOLATING file per component and exactly one aggregating group per module, which is what
# makes incrementality mean something. See UdeaSymbolProcessor and docs/budgets.md.
ksp.incremental=true
ksp.incremental.log=false
