# The plugin id `dev.wildware.udea.agent`, declared the way Gradle actually resolves ids.
#
# Written by hand rather than by the `java-gradle-plugin` plugin, on purpose: that plugin adds
# `gradleApi()` to the `api` configuration, and the `udea.gradle-plugin` convention keeps
# `gradleApi()` `compileOnly` precisely so the whole Gradle API cannot reach a consumer's runtime
# classpath - the defect the old `gradle-plugin` module shipped. A properties file is the same
# mechanism `java-gradle-plugin` generates, minus the dependency it would add.
#
# `build-logic` compiles the same source and declares the same id through `gradlePlugin {}`, which
# is what lets THIS build apply it to `:moba`; a subproject's plugin cannot be applied to a sibling
# subproject of the same build. `UdeaAgentPluginIdTest` asserts the two declarations agree.
implementation-class=dev.wildware.udea.gradle.UdeaAgentPlugin
