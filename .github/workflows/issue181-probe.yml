# TEMPORARY - issue #181 measurement probe. Deleted before the branch is handed over.
# Runs only on pushes to the issue branch. Measures, per runner:
#   - what the current gate measures (first clean build, cold configuration cache)
#   - repeated clean builds in the same job (is the noise within-job or between-runners?)
#   - alternating clean builds of two checkouts of the same commit (does a same-job ratio hold?)
name: issue181-probe

on:
  push:
    branches: [issue-181-clean-build-budget]

jobs:
  probe:
    name: probe ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Machine
        shell: bash
        run: |
          nproc; free -m; grep -m1 "model name" /proc/cpuinfo; lscpu | head -20
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          cp -r . ../base
          measure() { # label dir
            read -r _ u n s i w q sq st _ < /proc/stat
            start=$(date +%s%3N)
            (cd "$2" && ./gradlew clean udeaAssemble --no-build-cache > /tmp/g.log 2>&1) || { tail -60 /tmp/g.log; exit 1; }
            end=$(date +%s%3N)
            read -r _ u2 n2 s2 i2 w2 q2 sq2 st2 _ < /proc/stat
            echo "SAMPLE $1 wall_ms=$((end-start)) busy_jiffies=$(( (u2+n2+s2+q2+sq2)-(u+n+s+q+sq) )) idle_jiffies=$(( (i2+w2)-(i+w) )) steal_jiffies=$((st2-st))"
          }
          ./gradlew help -q > /dev/null
          measure current-gate .
          measure head-warm-1 .
          measure head-warm-2 .
          measure head-warm-3 .
          (cd ../base && ./gradlew help -q > /dev/null)
          measure base-warmup ../base
          for i in 1 2 3; do
            measure base-$i ../base
            measure head-$i .
          done
