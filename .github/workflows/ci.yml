# The single CI workflow for this repository.
#
# Later epics add *jobs or matrix legs here*; they do not create a second workflow, and they
# record their numbers in the single `docs/budgets.md` rather than a second budgets document.
# Gates that have landed and run inside the `build` job, because they are wired into `check`
# and therefore need no step of their own: the golden-file diffs and the `net-protocol.lock`
# drift check (`udeaCheckProtocolLock`, registered by `registerNetProtocolLock` in
# `build-logic` for every module that emits a protocol).
#
# The **wall-clock latency budgets are not among them** - `udeaSnapshotBudget`,
# `udeaBenchTickLoop`, `udeaBenchCharacterMover`, `udeaDaemonBudget`, `udeaGraphBudget` and
# `udeaPhase2Exit` are measured by the `latency-budgets` job below, which runs them serially
# with nothing else on the runner. Issue #175 has the reasoning; the short version is that a
# millisecond measured while nineteen modules compile is a measurement of the compilation.
#
# The `game-bridge-mcp` conformance run is the `bridge-conformance` job below: its own job and
# not a step, because it needs a JVM and Node at once and it needs a game process left running
# while something else drives it.

name: CI

on:
  push:
  pull_request:
  # The Kotlin-RC leg (spec 3.2's version policy). Nightly, and never on a PR, because its
  # whole job is to find an API break *before* it is urgent - not to block a merge with one.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      clean_build_budget_ms:
        description: >-
          Clean-build budget in milliseconds. Set it to 1 to prove the gate still fails;
          leave it alone for the real 90s budget from the Phase 0 exit criteria.
        required: false
        default: "90000"
      ksp_cold_budget_ms:
        description: >-
          Cold codegen-pass threshold in milliseconds for the `ksp-incremental-budget` job.
          Set it to 1 to prove that gate still fails.
        required: false
        default: "90000"
      ksp_edit_budget_ms:
        description: >-
          One-component-edit threshold in milliseconds for the `ksp-incremental-budget` job.
        required: false
        default: "40000"
      replay_plant_ulp_at:
        description: >-
          Plant a one-ulp divergence at this tick on the single `replay-equality` leg the
          matrix marks `plant: true`, to prove the cross-OS gate still fails. 1200 is the
          tick `MobaFixture.PLANT_TICK` names, and it lands on the champion's `Position.x`.
          Leave it empty for an honest run.
        required: false
        default: ""

# A superseded run is a run whose answer nobody wants. Cancelling them is what keeps the
# windows-latest leg affordable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No build exclusions. There used to be four: `level-editor` and `idea-plugin` could not
# compile, and every job worked around it with `-x`. D6 deleted both modules along with
# `compose-ui` (Phase 0, issue #137), so the whole repository - old tree included - builds
# green. A workflow that carries an exclusion nobody has retested is a workflow that hides the
# next breakage, so the list is gone rather than emptied.

jobs:
  build:
    # Both operating systems from Phase 0, not from Phase 7.
    #
    # Spec 7 wants float divergence caught on every CI platform early, and the Phase 7 exit
    # needs replay equality proven on two OS/JVM combinations. Getting windows-latest green
    # while the tree is small costs a matrix leg; getting it green in Phase 7, against a
    # simulation that already assumes Linux behaviour, costs a phase.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # A pull request writing to the shared cache is a pull request that can poison it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # `gradlew` is checked in without the executable bit, so the POSIX launcher has to be
      # made runnable before it can be run.
      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # `-Pudea.render.requireGl=false` is written out rather than left to the property's
      # default, and it is a decision rather than a formality. `check` depends on `udeaGlTest`
      # and `udeaAgentGlTest`, so this leg *does* run them - and neither runner here can serve
      # them a context: `windows-latest` exposes only the GDI generic renderer (OpenGL 1.1),
      # which is below what `Lwjgl3Backend` asks for, and this `ubuntu-latest` step runs with
      # no X server at all. Both therefore skip, on purpose, and the `gl-tests` job below is
      # where the same tests are made to *pass or fail*. Deleting that job and leaving this
      # property alone would silently return the whole GL surface to being untested, which is
      # the state this comment exists to make impossible to reach by accident.
      - name: Build and verify the module graph
        shell: bash
        run: >-
          ./gradlew build udeaVerifyNoLegacyDependencies udeaVerifyModuleGraph
          -Pudea.render.requireGl=false
          --stacktrace

      # Issue #168, and the same defect class as the `gl-tests` job below: a test that skips is
      # reported as a pass. `AtlasPackerTest` and `ReproducibilityTest` used to abort their
      # assumptions on every machine without the two paid Tiny RPG archives - which is every
      # machine but the owner's, this runner included - so nine tests reported green having packed
      # nothing at all. They now run against `SyntheticArt`, a corpus of the same shape drawn at
      # test time from no third-party pixels, and this step is what stops them going quietly back:
      # it names the two result files and fails on a `<skipped>` in either.
      #
      # The difference from the GL case is worth keeping straight. That skip is environmental and
      # the fix was to supply a display; this one was structural and the fix was to supply a
      # corpus. `RealArtAtlasPackerTest` and `RealArtReproducibilityTest` are the same two bodies
      # pointed at the paid art, they are *expected* to skip here, and they are deliberately not
      # named below.
      #
      # It reads the counts rather than grepping for `<skipped`, and that is the whole difference
      # between this gate and a vacuous one. A grep for a skip marker passes a report with **no
      # test cases in it at all** - a renamed class, a filter that stopped matching, a task that
      # wrote an empty suite - which is the same "green having checked nothing" the step exists to
      # forbid, arriving one level up. So: the file must exist, `tests` must be above zero, and
      # `skipped` must be exactly zero.
      #
      # No `if: always()`, unlike the GL job's version: `udeaPackGate` runs inside `check`, so a
      # build that failed earlier never reached it and never wrote these files. Reporting "the
      # atlas tests did not run" about such a run would be a true sentence that reads as a second,
      # invented defect.
      - name: Assert the atlas determinism tests ran and none skipped
        shell: bash
        run: |
          set -euo pipefail
          results=udea-assets-compiler/build/test-results/udeaPackGate
          suites=(
            "$results/TEST-dev.wildware.udea.assets.compiler.atlas.AtlasPackerTest.xml"
            "$results/TEST-dev.wildware.udea.assets.compiler.pack.ReproducibilityTest.xml"
          )
          for report in "${suites[@]}"; do
            if [ ! -s "$report" ]; then
              echo "::error::$report was not written - udeaPackGate did not run the atlas tests"
              exit 1
            fi
            counts=$(sed -n 's/.*<testsuite [^>]*tests="\([0-9][0-9]*\)"[^>]*skipped="\([0-9][0-9]*\)".*/\1 \2/p' "$report" | head -1)
            if [ -z "$counts" ]; then
              echo "::error::$report has no <testsuite> counts - it is not a JUnit report"
              exit 1
            fi
            ran=${counts% *}
            skipped=${counts#* }
            if [ "$ran" -eq 0 ]; then
              echo "::error::$report reports 0 tests - the suite was filtered away or renamed"
              exit 1
            fi
            if [ "$skipped" -ne 0 ]; then
              echo "::error::$report skipped $skipped of $ran - the synthetic corpus was not packed"
              exit 1
            fi
            echo "$(basename "$report"): $ran ran, $skipped skipped"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
          retention-days: 7

      # The measured numbers, on a GREEN run as well as a red one. A budget you can only read
      # once you have blown it tells you nothing about the headroom you had on the way there,
      # and the Phase 0 exit is stated as a number, so the number has to survive a passing run.
      #
      # `tick-loop.json` is no longer among them: since issue #175 the wall-clock budgets are
      # measured by the `latency-budgets` job, and that job uploads them under its own artifact
      # name. What this step still collects is every other `reports/udea` file a full build
      # writes - the stdlib pin, the compiler-plugin scan, the legacy ledger, the determinism
      # report, the release scan, `moba`'s startup json - which is why `if-no-files-found:
      # error` is still the right setting here rather than a lie waiting to happen.
      - name: Upload measured budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udea-budgets-${{ matrix.os }}
          path: |
            **/build/reports/udea/**
          if-no-files-found: error
          retention-days: 7

  latency-budgets:
    # Issue #175: **a wall-clock latency measurement taken beside a parallel build measures the
    # build**, so the six gates that assert a number of milliseconds get a runner to themselves.
    #
    # ## The defect
    #
    # `udeaPhase2Exit`, `udeaDaemonBudget`, the graph-deserialisation budget and the two
    # `udea-core` benches hung off `check`. `check` runs inside `build`, so every one of them was
    # timed while nineteen other modules compiled on the same cores. On run 33428671524 -- the
    # first run that reached them at all, because before #170 the build died at
    # `:moba:udeaPackBundle` -- `udeaPhase2Exit` measured 1485ms against its 1000ms budget on
    # `ubuntu-latest` and failed again on `windows-latest`, and `udeaDaemonBudget` and
    # `udeaPackGate` failed on the plugin-disabled leg. Nothing in any of those tests had changed;
    # none of them reads `moba/assets`; all three use synthetic fixtures.
    #
    # The same tasks on this project's own development box, inside a parallel build and then
    # alone: warm reload 646ms then 195ms, warm validate 377ms then 151ms, graph deserialisation
    # a 31.4ms median then 7.6ms. Two to four times, from the same bytes.
    #
    # ## Why this job and not one of the other two answers
    #
    # The issue names three. Widening the numbers is refused by the tests' own KDoc and would
    # have measured nothing. Taking the budgets off `check` and running them only where the
    # machine is known is cheapest and quietly means nobody measures latency in CI at all. This
    # is the third: they still run on every push, on both runner images, and they are still hard
    # gates -- they simply run where the measurement is a measurement.
    #
    # ## What makes the job exclusive, and why both flags
    #
    # `--no-parallel` stops Gradle executing tasks from two projects at once. `--max-workers=1`
    # stops it running anything at all beside the forked test JVM -- without it Gradle is free to
    # start the next task's worker while a budget is being timed. Either alone leaves a second
    # process on the other cores, which is the whole defect. `:udea-gradle`'s
    # `LatencyBudgetJobTest` asserts both flags are still here, that this job still covers every
    # runner image the `build` job covers, and that no other step in this workflow runs a budget
    # task beside anything else.
    #
    # ## Why the compile is a separate step
    #
    # Compiling three modules serially would cost several minutes of runner time for no benefit:
    # nothing is being measured yet. So the warm-up step compiles in parallel like any other job,
    # and only the step that takes the readings is serialised. The Gradle daemon survives between
    # steps, so the measuring invocation finds its inputs up to date and does nothing but run the
    # six test tasks.
    name: latency budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # In parallel, deliberately: this step measures nothing.
      - name: Compile what the budgets measure
        shell: bash
        run: >-
          ./gradlew
          :udea-core:testClasses
          :udea-assets-compiler:testClasses
          :udea-agent-host:testClasses
          --stacktrace

      - name: Measure, with the runner to itself
        shell: bash
        run: ./gradlew udeaLatencyBudgets --no-parallel --max-workers=1 --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latency-budget-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

      # On a green run as well as a red one, and for the same reason the `build` job says it:
      # `udeaBenchTickLoop` writes `build/reports/udea/tick-loop.json` and its own KDoc calls it
      # "published by the Phase 0 CI job as the gate's artifact". This is now that job.
      - name: Upload measured budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udea-latency-budgets-${{ matrix.os }}
          path: |
            **/build/reports/udea/**
          if-no-files-found: error
          retention-days: 7

  gl-tests:
    # The GL surface, made to pass or fail rather than to skip.
    #
    # ## The defect this closes
    #
    # `udeaGlTest` (`:udea-render`) and `udeaAgentGlTest` (`:udea-agent-host`) both read
    # `udea.render.requireGl` and both default it to `false`, and no job set it. So on every CI
    # runner `GlAvailability.probe()` failed, `require()` called `Assumptions.abort`, and every
    # single GL test - the offscreen backend, capture determinism, overlay isolation, the whole
    # agent render toolset - reported green having checked nothing. "GL tests pass" was a true
    # statement about a suite that never ran a line of GL.
    #
    # ## Why a display, and why this job rather than the `build` matrix
    #
    # A skip cannot be removed by asserting harder; the tests need a context, so the job has to
    # supply one. `xvfb` plus Mesa's software rasteriser gives GLFW a real X display and a real
    # GL 4.x implementation with no GPU involved, which is what makes this affordable on a
    # hosted runner. It is a separate job because it needs `apt-get` and a virtual framebuffer -
    # neither of which `windows-latest` has - and because a red leg here should say "GL broke",
    # not "the build broke somewhere".
    #
    # ## The gate is `-Pudea.render.requireGl=true`
    #
    # With it, a context that cannot be created is a **failure**, not a skip: the `check(...)`
    # in `GlAvailability.require()` throws with the reason. That is the whole point - if Mesa,
    # xvfb or the LWJGL natives stop working, this job goes red instead of quietly returning to
    # the state described above. Do not "fix" a red run here by dropping the property.
    #
    # Ubuntu only, and that is a stated limitation rather than an oversight: `windows-latest`
    # runners expose the GDI generic renderer (OpenGL 1.1) with no software fallback that
    # `Lwjgl3Backend` can use, and `macos-latest` cannot run a GL context under a headless
    # runner session at all. The `build` job therefore passes `-Pudea.render.requireGl=false`
    # explicitly on both of its legs, so the skip there is written down instead of defaulted.
    name: gl tests (xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # GLFW opens an X11 window even for an `Offscreen` backend - the window is hidden, not
      # absent - so the X client libraries have to be present as well as the framebuffer, and a
      # missing one surfaces as a `GLFW_PLATFORM_ERROR` that reads like a driver fault.
      # `libgl1-mesa-dri` is the software rasteriser itself; without it there is a display and
      # no GL on it.
      - name: Install a display and a software GL stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y --no-install-recommends libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa
          sudo apt-get install -y --no-install-recommends libx11-6 libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # `xvfb-run -a` picks a free display number; `LIBGL_ALWAYS_SOFTWARE=1` stops Mesa looking
      # for a GPU that is not there and falling back with a warning instead of a context.
      #
      # `--rerun-tasks` is deliberate and is not paranoia: both test tasks are up-to-date-
      # checked on their inputs, and *nothing in their inputs changes when a display appears*.
      # Without it, a cache entry written by the `build` job - where every test skipped - is a
      # valid up-to-date result for this job, and the gate goes green without executing.
      - name: Run the GL suites against a real context
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24"
          ./gradlew :udea-render:udeaGlTest :udea-agent-host:udeaAgentGlTest
          -Pudea.render.requireGl=true
          --rerun-tasks --stacktrace

      # A skipped GL test is the failure this job exists to remove, so a run that skipped one is
      # a failed run even when Gradle was happy. JUnit writes `<skipped/>` into the XML for an
      # aborted assumption, and that is what is grepped for: it is the exact artefact
      # `Assumptions.abort` leaves behind.
      - name: Assert nothing skipped
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=()
          reports+=(udea-render/build/test-results/udeaGlTest/*.xml)
          reports+=(udea-agent-host/build/test-results/udeaAgentGlTest/*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::no GL test results were written at all - the suites did not run"
            exit 1
          fi
          if grep -l "<skipped" "${reports[@]}" > /dev/null 2>&1; then
            echo "::error::a GL test skipped despite -Pudea.render.requireGl=true"
            grep -l "<skipped" "${reports[@]}"
            exit 1
          fi
          echo "GL result files: ${#reports[@]}, none skipped"

      - name: Upload GL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-test-reports
          path: |
            udea-render/build/reports/tests/**
            udea-render/build/test-results/**
            udea-agent-host/build/reports/tests/**
            udea-agent-host/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  legacy-ledger:
    # Issues #136 and #146. Two questions the rest of CI cannot answer: is every old-tree file
    # still accounted for, and has anything in the new tree been copied out of the old one
    # without a current review?
    #
    # Spec section 7 rates two coexisting module trees as the highest-impact insidious risk on
    # the project - the globals leak back and headless silently breaks, with the symptom
    # appearing far from the cause. `udeaVerifyNoLegacyDependencies` catches the *classpath*
    # half of that. This catches the half a classpath check cannot see: a file copied forward
    # by hand.
    #
    # **This job must be a required status check on `master`.** That is a repository setting,
    # not something a workflow file can assert.
    #
    # Both tasks are also on `check`, so the `build` job above already runs them. Naming them
    # here as well is deliberate: this leg finishes in under a minute and says *which* rule
    # broke, where a red `build` on two operating systems says only that something did.
    name: migration ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # `build-logic` is an included build, so its tests are NOT run by the root `build`.
      # Without this step every rule behind every Phase 0 gate - the module graph, the legacy
      # classpath, the release scan and both migration gates - would be verified only by the
      # gates themselves passing on a tree that happens to be clean, which proves nothing about
      # whether they can still fail.
      - name: The gate rules' own test suite
        shell: bash
        run: ./gradlew -p build-logic check --stacktrace

      - name: Every old-tree file is in the ledger, and no copy is unreviewed
        shell: bash
        run: ./gradlew udeaLegacyReport udeaVerifyMigration --stacktrace

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udea-migration-reports
          path: build/reports/udea/**
          if-no-files-found: error
          retention-days: 7

  agents-md:
    # Issues #138 and #139. `AGENTS.md` is the only thing an agent starting cold reads, so a
    # module table that no longer matches `settings.gradle.kts` is a correctness bug rather
    # than a docs nit - it is how an agent ends up writing into a module that does not exist,
    # or never learning about one that does.
    #
    # `udeaVerifyTrelloMap` rides along because it is the same class of failure: bookkeeping
    # spanning two systems, which decays into nothing unless something goes red when it drifts.
    #
    # **This job must be a required status check on `master`.**
    name: agent brief matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: AGENTS.md and the Trello map describe the tree that exists
        shell: bash
        run: ./gradlew udeaVerifyAgentsMd udeaVerifyTrelloMap --stacktrace

  plugin-disabled:
    # Spec 7's mitigation for D8, and a Phase 0 exit criterion: **CI proves the build is green
    # with the K2 plugin disabled.**
    #
    # This is the leg that keeps the plugin from becoming load-bearing. If a Kotlin release
    # breaks `udea-compiler-plugin`, the project flips `udea.compilerPlugin.enabled=false`,
    # opens a tracking issue and keeps moving with checkers off - instead of every phase
    # queueing behind one compiler plugin. `docs/compiler-plugin.md` has the degrade
    # procedure.
    #
    # ## What this leg proves, and how it came to prove it
    #
    # Until issue #164 it proved almost nothing. `-Pudea.compilerPlugin.enabled=false` was read
    # by `udea.kotlin-library` and consumed by nobody: no module applied a
    # `KotlinCompilerPluginSupportPlugin`, so this job compiled byte for byte what the `build`
    # job compiled and reported 128 of 131 tasks up to date, which was itself the proof it had
    # changed nothing.
    #
    # `UdeaCompilerPluginSupport` in `build-logic` now applies the plugin to every `udea-*`
    # module and to `moba`, and reads the flag in `isApplicable`. With the flag off, no
    # `udea-compiler-plugin` jar reaches a `kotlinCompilerPluginClasspath` and no `-Xplugin`
    # argument is produced anywhere - and `udeaVerifyCompilerPlugin`, which runs on `check` for
    # every module, FAILS if one still does. So a green tick here now means the degrade path
    # works. The `checkers-fire` job below is the other half: it proves that the source which
    # compiles clean here is a hard build failure with the plugin on.
    #
    # **This job must be a required status check on `master`.** That is a repository setting,
    # not something a workflow file can assert; see `docs/compiler-plugin.md`.
    name: build with the K2 plugin disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # `udeaVerifyPluginOptional` first: it is a static check and it fails in seconds, so a
      # production source that has started importing a `dev.wildware.udea.compiler` type says
      # so before a full build spends ten minutes discovering the same thing indirectly.
      - name: Verify the plugin is optional
        shell: bash
        run: ./gradlew :udea-compiler-plugin:udeaVerifyPluginOptional --stacktrace

      # Every module, `moba` included, with the plugin switched off before any -Xplugin
      # argument is produced. No `-x` any more: the exclusion this step used to carry
      # (`:udea-compiler-plugin:test`) was justified by the outer switch doing nothing, and a
      # workflow that carries an exclusion nobody has retested is a workflow that hides the
      # next breakage. `udeaVerifyCompilerPlugin` is named explicitly as well as reached
      # through `check`, so this leg keeps asserting the absence even if `check` is narrowed.
      - name: Build everything with the plugin disabled
        shell: bash
        run: >-
          ./gradlew build udeaVerifyCompilerPlugin -Pudea.compilerPlugin.enabled=false
          --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-plugin-disabled
          path: |
            **/build/reports/tests/**
            **/build/reports/udea/**
          retention-days: 7

  checkers-fire:
    # Issue #164's acceptance, as a job: **a `@Net val` in a real `udea-*` module fails the
    # build with the correct rule id at the correct symbol, and the same source compiles
    # cleanly with the plugin disabled.**
    #
    # Everything else about the K2 plugin is proved one level in from here.
    # `:udea-compiler-plugin:test` drives a real `K2JVMCompiler` over throwaway sources, which
    # proves the checkers work when the plugin is loaded; `udeaVerifyCompilerPlugin` reads the
    # resolved plugin classpath, which proves the jar is where Gradle says it is. Neither
    # answers the question this job asks - whether a defect written into a real module's real
    # source set actually stops a real build. For the whole of Phase 0 the answer was no, and
    # every gate was green.
    #
    # The fixture is written here rather than checked in for the obvious reason: it must not
    # compile.
    #
    # `udea-assets` is the module used, and the reason is narrower than "it can see the
    # annotations". Three things have to be true of the module at once, and the third is the
    # one issue #173 was about:
    #
    #   1. the K2 plugin is applied to it - `UdeaCompilerPluginWiring.appliesTo` accepts it, so
    #      not `:udea-annotations`, `:udea-diagnostics` or `:udea-compiler-plugin`;
    #   2. `udea-annotations` is on its **compile** classpath. `udea-assets` declares
    #      `api(project(":udea-annotations"))` itself, which is the shortest and least
    #      accident-prone route there is - no transitive edge to reason about;
    #   3. its sources are compiled **once**. `udea-gradle`, which this job used to probe, is
    #      not: `build-logic/build.gradle.kts` adds `../udea-gradle/src/main/kotlin` to
    #      `build-logic`'s own main source set, so the probe was compiled by
    #      `:build-logic:compileKotlin` - an included build, with neither `udea-annotations`
    #      nor the K2 plugin anywhere on it - before any task of the main build ran. The job
    #      answered with six `Unresolved reference` errors and had never once reached a
    #      checker. Which trees those are is not repeated here: `CompilerPluginSwitchTest`
    #      reads the `kotlin.srcDir(...)` calls out of `build-logic/build.gradle.kts` and
    #      checks this `probe=` path against whatever it finds.
    #
    # The claim that used to stand here named `udea-gradle`'s compile classpath as the reason
    # for the choice, and issue #173 recorded it as false because `implementation` does not
    # propagate. It is not false: `implementation(project(":udea-assets-compiler"))` does put
    # `udea-annotations` on `udea-gradle`'s compile classpath, through two `api` edges, and
    # `./gradlew :udea-gradle:dependencies --configuration compileClasspath` prints it. The
    # sentence was true and the module was still the wrong one, which is why the fix is a move
    # rather than a dependency.
    #
    # Two alternatives were rejected. Adding `udea-annotations` to `udea-gradle` for the
    # probe's sake would have been a production dependency nobody needs *and* would not have
    # worked, because `build-logic`'s classpath is the one that was short. Having this step add
    # and remove that dependency around the probe fails for the same reason, and would have
    # looked like a fix while the job stayed red. `CompilerPluginSwitchTest` asserts (1) and
    # (3) against this file, so a future move back into a doubly-compiled tree is a red test
    # rather than a red job nobody reads.
    #
    # The line and column are computed from the fixture rather than hard-coded. Presence alone
    # is not enough, and `docs/compiler-plugin.md` says why: a rule that fires on the right
    # symbol and one that fires on the enclosing file pass the same test without a position
    # assertion, and only one of them is the Phase 0 demo criterion.
    #
    # **This job must be a required status check on `master`.**
    name: the FIR checkers fail a real build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: A broken component fails a real build, and compiles clean without the plugin
        shell: bash
        run: |
          set -euo pipefail
          # The module, once. `probe` and the Gradle task below are both derived from it, so
          # the file this step writes and the compilation it inspects cannot come apart.
          module=udea-assets
          probe=udea-assets/src/main/kotlin/dev/wildware/udea/assets/CheckerProbe.kt
          logs=$(mktemp -d)
          # Deleted whatever happens, so a failing run cannot leave a source that will not
          # compile behind for a later step or for an artifact upload. The compiler output goes
          # to a temporary directory for the same reason: it must not land in the workspace,
          # where an artifact glob would pick it up as if it were a build report.
          trap 'rm -f "$probe"; rm -rf "$logs"' EXIT

          cat > "$probe" <<'KOTLIN'
          package dev.wildware.udea.assets

          import dev.wildware.udea.annotations.Net
          import dev.wildware.udea.annotations.Q
          import dev.wildware.udea.annotations.Replicated

          @Replicated
          internal class CheckerProbe(
              @Net val health: Int = 0,
              @Q(bits = 8, min = 0f, max = 1f) var slots: Int = 0,
          )
          KOTLIN

          # Where each diagnostic must land: the property NAME, not the class, not the file.
          health_line=$(grep -n 'val health' "$probe" | cut -d: -f1)
          health_col=$(awk '/val health/ { print index($0, "health"); exit }' "$probe")
          slots_line=$(grep -n 'var slots' "$probe" | cut -d: -f1)
          slots_col=$(awk '/var slots/ { print index($0, "slots"); exit }' "$probe")
          echo "expecting UDEA0001 at ${health_line}:${health_col}, UDEA0003 at ${slots_line}:${slots_col}"

          if ./gradlew ":${module}:compileKotlin" --console=plain > "$logs/enabled.log" 2>&1; then
            echo "::error::a @Net val and a @Q Int compiled cleanly in ${module}, so the K2 plugin is not applied to a real compilation and the FIR checkers cannot fail a build"
            tail -n 40 "$logs/enabled.log"
            exit 1
          fi

          # Three outcomes from a failed compile, not two.
          #
          # A compile can fail without a checker having run at all, and for the whole of
          # Phase 0 that is what this step did (#173): the probe never resolved its imports, so
          # the only thing that noticed was the position greps below, and what they said was
          # "expected UDEA0001, got nothing" - which points a reader at the checkers, the one
          # place the fault was not. So "failed for a reason that is not a checker" is
          # separated out and named before any position is asserted.
          grep -E '^e: ' "$logs/enabled.log" > "$logs/errors.log" || true
          if ! grep -qE 'UDEA[0-9]{4}:' "$logs/errors.log"; then
            echo "::error::the probe failed to compile, but not one diagnostic carries a UDEA rule id, so no FIR checker ran. This says nothing about the checkers either way - it is the probe failing for the wrong reason. Check that :${module} resolves dev.wildware.udea.annotations from this compilation, and that nothing else in the build compiles ${probe} first."
            # The tail as well as the error lines: a build that fails before the compiler
            # starts - a bad JDK, a configuration failure - produces no `e:` lines at all, and
            # an empty list here would look identical to a compiler that reported nothing.
            cat "$logs/errors.log"
            echo "--- tail of the build log ---"
            tail -n 40 "$logs/enabled.log"
            exit 1
          fi
          if grep -vE 'UDEA[0-9]{4}:' "$logs/errors.log" | grep -q .; then
            echo "::error::the checkers fired, but :${module} also failed to compile for reasons that are not checkers, so the positions below would be read off a compilation that was broken anyway:"
            grep -vE 'UDEA[0-9]{4}:' "$logs/errors.log"
            exit 1
          fi

          status=0
          for expectation in "UDEA0001 ${health_line}:${health_col}" "UDEA0003 ${slots_line}:${slots_col}"; do
            rule=${expectation%% *}
            position=${expectation#* }
            if ! grep -q "CheckerProbe.kt:${position} ${rule}:" "$logs/errors.log"; then
              echo "::error::${rule} did not land at CheckerProbe.kt:${position}. Every diagnostic here is a UDEA rule, so the checkers did run; they reported:"
              cat "$logs/errors.log"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1

          # Echoed on the *success* path as well, not only on the failure paths. Both gradle
          # invocations write to a temporary directory that the EXIT trap removes, so without
          # this a green run leaves a log saying only that it expected something - and a gate
          # whose passing evidence is not in its own log is a gate nobody can quote later.
          echo "the compilation reported, and every line of it is a UDEA rule:"
          cat "$logs/errors.log"

          # The same source, the same module, the flag flipped. This is the half that makes the
          # degrade procedure in docs/compiler-plugin.md a procedure rather than a hope.
          if ! ./gradlew ":${module}:compileKotlin" -Pudea.compilerPlugin.enabled=false --console=plain > "$logs/disabled.log" 2>&1; then
            echo "::error::-Pudea.compilerPlugin.enabled=false did not remove the checkers: the same source still fails to compile"
            grep -E '^e: ' "$logs/disabled.log" || tail -n 40 "$logs/disabled.log"
            exit 1
          fi
          echo "-Pudea.compilerPlugin.enabled=false, the same file, :${module}:compileKotlin:"
          grep -E '^BUILD ' "$logs/disabled.log" || tail -n 3 "$logs/disabled.log"

          # Built once and written twice: to the job summary, which is where a person reads
          # it, and to stdout, which is where the run log keeps it. A summary is not in the
          # log and cannot be fetched with `gh api`, so a gate whose only evidence is the
          # summary is a gate nobody can quote afterwards.
          summary=$(
            echo "### The FIR checkers fail a real build"
            echo
            echo "| Rule | Symbol | Reported at |"
            echo "| --- | --- | --- |"
            echo "| UDEA0001 | CheckerProbe.health | ${health_line}:${health_col} |"
            echo "| UDEA0003 | CheckerProbe.slots | ${slots_line}:${slots_col} |"
            echo
            echo "Module: \`:${module}\`, main source set. Every diagnostic the compilation"
            echo "produced carried a UDEA rule id, so nothing here is a compile that failed for"
            echo "some other reason. The same file compiles clean under"
            echo "\`-Pudea.compilerPlugin.enabled=false\`."
          )
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

  kotlin-upgrade-probe:
    # Spec 3.2's version policy: the K2 plugin is the most Kotlin-version-fragile thing in the
    # project, so a coming break should be visible on a schedule rather than on the morning
    # somebody wants to upgrade.
    #
    # **What this leg does not do yet.** Issue #39 asks for a build against the next Kotlin
    # *RC*. That needs the project Kotlin version to be overridable, and it is not: the
    # `udea.kotlin-build-tool` convention fails configuration outright when the running Kotlin
    # Gradle plugin differs from `UdeaVersions.KOTLIN`, which is a hard-coded constant in
    # `build-logic` (and deliberately so - see spec 7). Until that pin grows an explicit
    # override, this leg does the half that is honest: it reruns the gate suite nightly and
    # reports the newest published Kotlin beside the pinned one, so an upgrade is a decision
    # someone takes rather than a surprise. `docs/compiler-plugin.md` records the gap.
    #
    # `continue-on-error` plus the schedule-only guard is what makes it **non-blocking**. It
    # reports; it never gates a merge.
    name: kotlin upgrade probe (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # `check`, not `test`: it pulls in `udeaVerifyKotlinPin` and `udeaVerifyPluginOptional`
      # as well as the compile-testing suite, and a resolved stdlib that no longer matches the
      # compiler is the first symptom of an upgrade going wrong.
      - name: Run the compiler-plugin gate suite
        shell: bash
        run: ./gradlew :udea-compiler-plugin:check --stacktrace

      - name: Report the pinned Kotlin against the newest published one
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pinned=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml | head -1)
          latest=$(
            curl -sS --max-time 60 \
              https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/maven-metadata.xml \
              | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' | head -1
          )
          {
            echo "### Kotlin upgrade probe"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Pinned (\`libs.versions.toml\`) | \`${pinned}\` |"
            echo "| Newest on Maven Central | \`${latest:-unknown}\` |"
            echo "| Gate suite (\`:udea-compiler-plugin:check\`) | \`${{ job.status }}\` |"
            echo
            echo "Advisory only; this leg cannot block a merge. A red gate suite means the K2"
            echo "plugin needs work before the next Kotlin bump - see the degrade procedure in"
            echo '`docs/compiler-plugin.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

  clean-build-budget:
    # ubuntu-latest only. The budget is a trend line, and a trend line measured on two
    # differently sized runners is two trend lines pretending to be one.
    name: clean build under budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # The budget is about compiling this project, not about starting a JVM. Warming the
      # daemon first is what stops the number being dominated by Gradle's own startup.
      - name: Warm the daemon
        shell: bash
        run: ./gradlew help

      - name: Time a clean build of the rewrite tree
        shell: bash
        env:
          # `udeaAssemble`, never `assemble`: the old modules would dominate the number -
          # `idea-plugin` alone resolves an entire IntelliJ distribution - and a budget the
          # rewrite cannot move is a budget nobody acts on.
          #
          # The configuration cache stays ON (it is on in `gradle.properties`). A fresh runner
          # has no cache entry, so this is a genuine cold build; disabling it would measure a
          # configuration the project never actually runs.
          UDEA_CLEAN_BUILD_BUDGET_MS: ${{ github.event.inputs.clean_build_budget_ms || '90000' }}
        run: |
          set -euo pipefail
          budget="${UDEA_CLEAN_BUILD_BUDGET_MS}"
          start=$(date +%s%3N)
          ./gradlew clean udeaAssemble --no-build-cache --stacktrace
          end=$(date +%s%3N)
          elapsed=$((end - start))

          {
            echo "### Clean build budget"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Command | \`./gradlew clean udeaAssemble --no-build-cache\` |"
            echo "| Runner | \`${RUNNER_OS}\` / \`ubuntu-latest\` |"
            echo "| Measured | **${elapsed} ms** |"
            echo "| Budget | ${budget} ms |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$elapsed" -gt "$budget" ]; then
            echo "::error::clean build took ${elapsed} ms, over the ${budget} ms budget (spec 6, Phase 0 exit)"
            exit 1
          fi
          echo "clean build took ${elapsed} ms, within the ${budget} ms budget"

  ksp-incremental-budget:
    # The codegen epic's half of the build budget (issue #35). It owns `ksp.incremental` and a
    # per-task regression threshold; the <90s clean-build gate above is a different measurement
    # and stays where it is.
    #
    # ubuntu-latest only, for the same reason `clean-build-budget` is: a threshold measured on
    # two differently sized runners is two thresholds pretending to be one.
    name: KSP stays incremental
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Warm the daemon
        shell: bash
        run: ./gradlew help

      # The gate that cannot give a false positive on a slow runner, and the one that catches
      # the exact regression this issue exists to prevent: an output whose name or dependency
      # set varies between runs is never up to date, so a second identical build re-executes.
      # The generator this replaces named its module index after the wall clock, which made
      # every build a full rebuild - and no timing threshold would have said so, because the
      # first build is the same speed either way.
      - name: A second identical build must execute nothing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :udea-codegen:testClasses --no-build-cache > /dev/null
          ./gradlew :udea-codegen:testClasses --console=plain | tee /tmp/noop.log
          executed=$(grep -E '^> Task :udea-codegen:' /tmp/noop.log \
            | grep -vE 'UP-TO-DATE|SKIPPED|NO-SOURCE|FROM-CACHE' || true)
          if [ -n "$executed" ]; then
            echo "::error::a no-op build re-executed tasks, so something the processor emits is not reproducible:"
            echo "$executed"
            exit 1
          fi
          echo "no-op build executed nothing"

      # The timing threshold. The defaults are NOT baseline+20%, and saying so would be a lie
      # a reader could act on: the committed baselines in `docs/budgets.md` are 34 285 ms cold
      # and 10 767 ms for a one-component edit, measured on a 32-core workstation with a warm
      # configuration-cache entry, while this job is a 2-core `ubuntu-latest` runner with a
      # cold one. Baseline+20% (41 142 / 12 920) would fail on machine class rather than on a
      # regression. The 90 000 / 40 000 below are deliberately loose holding values - roughly
      # 2.6x and 3.7x the workstation numbers - chosen so the gate that carries the real
      # weight is the hard one above, which no threshold can fake. `docs/budgets.md` says the
      # same thing and records what has to happen before +20% becomes the rule: a baseline
      # measured *here*, from the step summary these runs write.
      #
      # Override them on a workflow dispatch to prove the gate can fail. Every run writes both
      # numbers to the job summary, pass or fail, so the trend is readable without opening a
      # log.
      - name: Time a cold KSP pass and a one-component edit
        shell: bash
        env:
          UDEA_KSP_COLD_BUDGET_MS: ${{ github.event.inputs.ksp_cold_budget_ms || '90000' }}
          UDEA_KSP_EDIT_BUDGET_MS: ${{ github.event.inputs.ksp_edit_budget_ms || '40000' }}
        run: |
          set -euo pipefail
          fixtures=udea-codegen/src/test/kotlin/dev/wildware/udea/codegen/fixtures/Components.kt

          ./gradlew :udea-codegen:clean > /dev/null
          cold_start=$(date +%s%3N)
          ./gradlew :udea-codegen:testClasses --no-build-cache > /dev/null
          cold=$(( $(date +%s%3N) - cold_start ))

          printf '\n// touched to measure a one-component edit\n' >> "$fixtures"
          edit_start=$(date +%s%3N)
          ./gradlew :udea-codegen:testClasses > /dev/null
          edit=$(( $(date +%s%3N) - edit_start ))
          git checkout -- "$fixtures"

          {
            echo "### KSP incremental budget"
            echo
            echo "| Scenario | Measured | Budget |"
            echo "| --- | --- | --- |"
            echo "| Cold \`kspTestKotlin\` + compile | **${cold} ms** | ${UDEA_KSP_COLD_BUDGET_MS} ms |"
            echo "| One-component edit | **${edit} ms** | ${UDEA_KSP_EDIT_BUDGET_MS} ms |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          if [ "$cold" -gt "$UDEA_KSP_COLD_BUDGET_MS" ]; then
            echo "::error::cold codegen pass took ${cold} ms, over the ${UDEA_KSP_COLD_BUDGET_MS} ms threshold"
            status=1
          fi
          if [ "$edit" -gt "$UDEA_KSP_EDIT_BUDGET_MS" ]; then
            echo "::error::a one-component edit took ${edit} ms, over the ${UDEA_KSP_EDIT_BUDGET_MS} ms threshold"
            status=1
          fi
          exit "$status"

  bridge-conformance:
    # Issue #81. The `game-bridge-mcp` TypeScript client, vendored verbatim in
    # `.github/conformance/vendor`, driven against a LIVE headless instance.
    #
    # Its own job rather than a step in `build`, for two reasons. It needs a JVM *and* Node, and
    # it needs a process left running while something else talks to it - which is a shape the
    # `build` job's single Gradle invocation has no room for. Ubuntu only: this asserts an HTTP
    # contract and a JSON document, neither of which is platform-dependent, and paying for a
    # second OS here buys a slower merge rather than a different answer.
    #
    # Spec 7 names silent drift from this contract as a top risk, and the reason is that the
    # bridge fails *quietly*: `normaliseManifest` drops a tool it cannot read rather than
    # reporting it, so a manifest regression makes a capability invisible; `commandAndSync`
    # degrades from `completedCommandId` to frame-watching, so losing that field turns command
    # confirmation into a race that reads as a flaky test. Neither is visible from Kotlin,
    # because neither is in Kotlin.
    name: game-bridge-mcp conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/conformance/package-lock.json

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # Compiled before the instance is started so that a compile failure is a compile failure
      # rather than a game that appears to be unreachable.
      - name: Compile the vendored client
        shell: bash
        working-directory: .github/conformance
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run test:vendor
          npm run build

      # The launch declaration, generated on a clean checkout and then parsed by the bridge's
      # own reader.
      #
      # Two holes closed at once. `gamebridge.json` is gitignored - it has to be, because
      # `launch.command` is run through a shell and no single string invokes this repository's
      # wrapper under both `cmd.exe` and `sh`; see `.gitignore` for the full argument. That makes
      # "a fresh clone can be launched" a claim about a *task*, and this step is what tests it:
      # the runner checked out a moment ago and has never built, so if the declaration is not on
      # the path everybody takes, the suite below fails with the task name it needed.
      #
      # And `launcher.ts` and `config.ts` were vendored, hashed and compiled by the step above
      # and then imported by nothing at all, so the one document that decides whether
      # `launch_instance` works had no test behind it. `launch-declaration.test.mjs` imports
      # them.
      - name: Generate the launch declaration the way a clean clone would
        shell: bash
        run: |
          set -euo pipefail
          test ! -f gamebridge.json || {
            echo "::error::gamebridge.json is present in a fresh checkout; it is generated, not committed"
            exit 1
          }
          ./gradlew :moba:udeaGenerateLaunchDeclaration --console=plain
          test -f gamebridge.json || {
            echo "::error::udeaGenerateLaunchDeclaration did not write gamebridge.json"
            exit 1
          }
          cat gamebridge.json

      - name: Parse it with the bridge's own reader
        shell: bash
        working-directory: .github/conformance
        run: node --test test/launch-declaration.test.mjs

      # Backgrounded, and its log kept: when the contract fails, the first question is always
      # whether the game was healthy, and the answer is in here.
      - name: Boot a headless instance with the agent surface bound
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :udea-agent-host:udeaPhase1Demo -Pudea.agent.port=7820 --console=plain \
            > agent-instance.log 2>&1 &
          echo "$!" > agent-instance.pid

      - name: Wait for GET /health
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -sf -m 2 http://127.0.0.1:7820/health > /dev/null; then
              echo "health: $(curl -s http://127.0.0.1:7820/health)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the instance never answered GET /health on port 7820"
          tail -50 agent-instance.log
          exit 1

      - name: Drive the real client against it
        shell: bash
        working-directory: .github/conformance
        env:
          UDEA_AGENT_PORT: "7820"
        run: node --test test/bridge-contract.test.mjs

      # The close half of the contract, and it has to be its own step because it needs the
      # instance *gone*. `close` is the one command with no confirmation to wait for - nothing
      # will ever report it completed - so the port going quiet is the only success signal
      # `waitForSilence` has, and a host that leaves its HTTP server bound after the game stops
      # leaves the bridge listing an instance it will keep failing against.
      #
      # ## What this step used to assert, and what it asserts now
      #
      # It used to `kill` the pid a second after starting the watcher, and then assert that the
      # port went quiet. That is a true statement about `kill(2)` and says nothing whatever
      # about the game: no `close` tool existed, `stop_instance` escalated to terminating the
      # process tree on every stop, and this step was green throughout.
      #
      # Nothing here signals the process. One `GET /command?cmd=close` is the only input, and
      # three things are checked after it:
      #
      #   1. `close` is in the manifest, spelled the way the bridge sends it. A tool named
      #      `lifecycle.close` is a tool `game-bridge-mcp` never calls.
      #   2. the port goes quiet - `expect-silence.mjs`, the bridge's own `waitForSilence`.
      #   3. the process is gone. Without this, a host that unbound its port and kept running
      #      would pass: silence is what the bridge believes, and believing it over a live
      #      process is the failure mode worth catching.
      - name: Ask the game to close itself, and assert it did
        shell: bash
        env:
          UDEA_AGENT_PORT: "7820"
        run: |
          set -euo pipefail
          pid="$(cat agent-instance.pid)"

          curl -sf -m 5 http://127.0.0.1:7820/tools > tools.json
          grep -Eq '"name"[[:space:]]*:[[:space:]]*"close"' tools.json || {
            echo "::error::GET /tools publishes no tool named close, so the bridge's own close"
            echo "::error::command would answer no_such_tool and stop_instance would fall back"
            echo "::error::to killing the process tree."
            exit 1
          }

          ( cd .github/conformance && node scripts/expect-silence.mjs ) &
          silence=$!

          # The only input. No kill, no signal, no interrupt anywhere in this step.
          curl -s -m 5 'http://127.0.0.1:7820/command?cmd=close&reason=ci+conformance' || true
          echo

          wait "$silence"

          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "process $pid exited on its own after close; nothing signalled it"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the port went quiet but process $pid is still alive 60s after close."
          echo "::error::A game that releases its port and keeps running reads to the bridge as"
          echo "::error::a clean close and leaves a process behind on every session."
          tail -50 agent-instance.log
          kill "$pid" 2>/dev/null || true
          exit 1

      - name: Upload the instance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-conformance-instance-log
          path: agent-instance.log
          if-no-files-found: warn
          retention-days: 7

  determinism:
    # `udeaVerifyDeterminism` (issue #150) and the float-portability probe behind
    # `determinism-audit.md` (issue #151), on BOTH operating systems and on TWO JVMs.
    #
    # ## Why this is a job when the scan already runs inside `build`
    #
    # `udeaVerifyDeterminism` is wired into `check`, so the `build` job above already runs it on
    # both platforms and a violation already fails that job. What `build` does *not* do is keep
    # the scan's report, and it does not run anything on a second JVM. Both matter here and
    # neither is decoration:
    #
    # - The report (`build/reports/udea/determinism.txt`) records how many class files were
    #   scanned per declared simulation scope. A scan whose class count silently went to zero
    #   passes forever - the task has a guard for that, and this artifact is how a human notices
    #   the number drifting before the guard is the only thing left.
    # - The second JVM is the point of the whole exercise. `FloatPortabilityTest` measures
    #   `java.lang.Math` against `java.lang.StrictMath` on the JVM it is running on, and
    #   `determinism-audit.md` section 3.1 rests on that measurement: `Math.sin` is permitted a
    #   1-ulp error and is not specified to agree between implementations, which is what makes
    #   LibGDX's `MathUtils$Sin` lookup table a per-JVM artifact. Measuring it on one vendor
    #   proves nothing about the pair. Temurin and Corretto are two independent builds, so this
    #   matrix is genuinely two dimensions - two OSes and two JVMs - rather than two OSes on one.
    #
    # ## What this job is NOT
    #
    # It is **not** the determinism gate, and spec section 7 says so directly. A bytecode
    # reference scan cannot see nondeterminism laundered through Fleks internals, through an
    # interface call whose receiver happens to be a `HashMap` built elsewhere, or through the
    # float divergence this job measures but cannot prevent. The gate is the `WorldHasher`
    # snapshot-equivalence test and the cross-OS `replay-equality` job at the foot of this file,
    # which issue #152 added on top of `:udea-replay`'s headless replay. A green tick *here* is
    # still not one there: if the two ever disagree, the replay result wins and this scanner
    # grows a rule.
    name: determinism (${{ matrix.os }}, ${{ matrix.distribution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        distribution: [temurin, corretto]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # The scan itself. Runs the aggregate task by name rather than `check`, so a failure here
      # is unambiguously a determinism finding and not some other module's test.
      - name: Scan the declared simulation source sets
        shell: bash
        run: ./gradlew udeaVerifyDeterminism --stacktrace

      # The parser, the audit's completeness and the float probe. These live in `build-logic`,
      # which the root `check` does not reach, so without this step the strictness that keeps
      # `determinism-allowlist.txt` from becoming a dumping ground is never executed in CI.
      - name: Verify the allowlist parser, the audit and float portability
        shell: bash
        run: ./gradlew -p build-logic test --stacktrace

      - name: Upload the determinism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}-${{ matrix.distribution }}
          path: |
            build/reports/udea/determinism.txt
            build-logic/build/reports/tests/test/**
          if-no-files-found: error
          retention-days: 7

  replay-equality:
    # **The determinism gate.** Issue #152, and spec section 7 says so in as many words: the
    # bytecode scanner above "produces false confidence", and the row of `determinism-audit.md`
    # §1 that matters most reads, in full, "The cross-OS `replay-equality` CI job. Nothing else."
    #
    # ## What each leg does
    #
    # Replays a checked-in `.udearep` headless and writes one `.udeaeq` digest stream: per tick,
    # every value `WorldHasher.hash(WorldSnapshot)` folds, keyed by `NetId`, component type and
    # field index. Not just the hash - a hash that differs names nothing, and Phase 7's exit
    # criterion is the first differing tick **and field**.
    #
    # ## What it replays, since issue #172: `moba`, and not a fixture world
    #
    # `moba-3600.udearep` is a minute of a real match - the champion piloted by a specified LCG,
    # and the AI units, the lane, the towers, the projectiles, the abilities and the match loop
    # all reproduced from the seed. Until #172 these legs replayed `DriftWorld`, a
    # purpose-built fixture that routes its trigonometry through `StrictMath` because its author
    # knew exactly which call was the trap: a world *written to be deterministic*, so three green
    # legs reported the health of their own fixture. `moba` was not written that way and is the
    # thing Phase 7 exists to make deterministic.
    #
    # `DriftWorld` stays checked in as the gate's **self-test**: `:udea-replay:udeaReplayEqualityProof`
    # plants a one-ulp divergence into it across five processes on one machine, and
    # `CrossPlatformDivergenceTest` pins the rendered cross-platform failure against a checked-in
    # expected output. `:moba:udeaReplayEqualityProof` does the same for this fixture, naming
    # `Position.x`.
    #
    # `ReplayDigestWriter` refolds its own cells into the world hash and refuses to write a tick
    # that does not reproduce it, so "the cells are exactly what the hash covers" is enforced on
    # every tick of every run rather than asserted once. That is what makes the `join` step below
    # able to promise it will never print a bare hash mismatch.
    #
    # ## Two dimensions, not two OSes on one JVM
    #
    # `windows-latest` is the second operating system and `corretto` is the second JVM, matching
    # the `determinism` job's pair. The vendor is passed to Gradle explicitly rather than left to
    # toolchain auto-detection: `setup-java` sets `JAVA_HOME`, but Gradle also finds whatever JDKs
    # the runner image ships, so two legs asking only for "17" can both resolve to the same vendor
    # and the second axis silently stops existing while both legs stay green. Each digest header
    # records the vendor it really ran on and the join step prints all of them, so the claim is
    # checkable in the log rather than assumed from this file.
    #
    # ## Nothing here is logic
    #
    # Every decision - what to write down, what counts as a divergence, how to render one, which
    # exit code to use, and every option on the leg's own command line - lives in `:udea-replay`'s
    # `main` classes (`ReplayDigestCli`, `ReplayDigestRecorder`, `ReplayEquality`) and is covered
    # by `CrossPlatformDivergenceTest`, `DivergenceReportFormatTest`, `ReplayDigestTest`,
    # `ReplayEqualityProofTest` and `MobaReplayEqualityTest`, plus the two five-process proofs
    # `:udea-replay:udeaReplayEqualityProof` and `:moba:udeaReplayEqualityProof`. What is `moba`'s
    # own - its fixtures, its world, its component registry, and what a plant perturbs - is
    # `MobaDigestMain`, which is six lines. Nobody can run GitHub Actions locally, so anything
    # expressed only here would be unverifiable until it had already gone wrong once.
    name: replay-equality (${{ matrix.os }}, ${{ matrix.distribution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distribution: temurin
            vendor: Adoptium
          - os: windows-latest
            distribution: temurin
            vendor: Adoptium
          # The second JVM, on the OS whose runners are cheapest. `determinism-audit.md` §3.1
          # measured `Math.sin` disagreeing with `StrictMath.sin` on 3.4% of sampled inputs on a
          # single JVM; two independent builds are under no obligation to disagree in the same
          # places, and no bytecode rule can see the difference because the bytecode is identical.
          - os: ubuntu-latest
            distribution: corretto
            vendor: Amazon
            # The leg `replay_plant_ulp_at` plants on, and **exactly one leg carries it**. A
            # planted divergence is deterministic: three legs all carrying the same plant agree
            # with each other, the join reports EQUAL, and a run whose whole purpose was to watch
            # the gate fail comes back green. One leg diverging from the other two is the shape a
            # real cross-OS float defect has, so it is the shape the proof uses.
            plant: true
    steps:
      - name: Start the clock
        id: clock
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # `-Pudea.replay.out` is workspace-relative, and that is only safe because
      # `:moba:udeaReplayDigest` hands `MobaDigestMain` a `--workspace` naming the repository
      # root - a `JavaExec` on its own would resolve this against `moba/`, which is issue #169
      # and is why no join step ever ran. `MobaReplayEqualityTest` drives the entry point with
      # this exact string and checks the answer against the upload glob below.
      #
      # The trailing expression is empty on every ordinary run. It is how `replay_plant_ulp_at`
      # reaches the one leg the matrix marks `plant: true`.
      - name: Replay the moba fixture and write this leg's digest
        shell: bash
        run: >-
          ./gradlew :moba:udeaReplayDigest
          -Pudea.replay.label=${{ matrix.os }}/${{ matrix.distribution }}-17
          -Pudea.replay.jvmVendor=${{ matrix.vendor }}
          -Pudea.replay.out=digests/${{ matrix.os }}-${{ matrix.distribution }}.udeaeq
          ${{ matrix.plant && github.event.inputs.replay_plant_ulp_at && format('-Pudea.replay.plantUlpAt={0}', github.event.inputs.replay_plant_ulp_at) || '' }}
          --stacktrace

      # The digest, named by leg so the join step can tell the three apart by filename alone.
      - name: Upload this leg's digest stream
        uses: actions/upload-artifact@v4
        with:
          name: replay-digest-${{ matrix.os }}-${{ matrix.distribution }}
          path: digests/*.udeaeq
          if-no-files-found: error
          retention-days: 7

      # Criterion 6: the added PR wall time, measured rather than estimated, on a green run as
      # well as a red one. Whole-job seconds, not the replay's own - checkout, JDK setup and the
      # Gradle build are wall time a pull request pays for too.
      - name: Report this leg's wall time
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - ${{ steps.clock.outputs.started }} ))
          echo "| ${{ matrix.os }} / ${{ matrix.distribution }}-17 | ${elapsed}s |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "replay-equality leg wall time: ${elapsed}s"
          if [ "$elapsed" -gt 240 ]; then
            echo "::warning::this leg took ${elapsed}s, over the 240s budget issue #152 states."
          fi

  replay-equality-join:
    # The verdict. Downloads every leg's digest and runs `ReplayEqualsMain` over the set.
    #
    # Its own job rather than a step, because it is the only thing here that needs *all* the legs
    # and it must run even when one of them is red - a leg that failed to produce a digest is a
    # different failure from two legs that disagree, and collapsing the two would report a broken
    # runner as a determinism defect.
    #
    # It needs no game and no simulation: `ReplayEqualsMain` reads nothing but the files.
    name: replay-equality (join)
    runs-on: ubuntu-latest
    needs: replay-equality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Download every leg's digest
        uses: actions/download-artifact@v4
        with:
          pattern: replay-digest-*
          path: digests
          merge-multiple: true

      - name: List what arrived
        shell: bash
        run: |
          set -euo pipefail
          ls -la digests
          count=$(find digests -name '*.udeaeq' | wc -l)
          echo "$count digest stream(s)"
          # Two is the minimum that proves anything, and `ReplayEqualsMain` says so itself with
          # exit code 2. Failing here as well means the log names the missing leg rather than
          # only the count.
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count digest stream(s) arrived; replay equality needs at least two."
            exit 1
          fi

      # Workspace-relative for the same reason, and resolved the same way: `udeaReplayEquals`
      # passes `ReplayEqualsMain` a `--workspace`, so `digests` here is the directory the
      # download step above wrote into rather than `udea-replay/digests`.
      - name: Compare every leg
        shell: bash
        run: >-
          ./gradlew :udea-replay:udeaReplayEquals
          -Pudea.replay.streams=digests
          --stacktrace

      # The rendered verdict, on a green run as well as a red one. A gate you can only read once
      # you have blown it tells nobody what headroom it had - the same reason the `build` job
      # publishes its measured budgets unconditionally.
      - name: Publish the verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary=udea-replay/build/reports/udea/replay-equality/summary.md
          {
            echo "## replay-equality"
            echo
            echo '```'
            cat "$summary" 2>/dev/null || echo "no summary was produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verdict and the digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-equality-verdict
          path: |
            udea-replay/build/reports/udea/replay-equality/**
            digests/*.udeaeq
          if-no-files-found: error
          retention-days: 7

  replay-equality-nightly:
    # **The long fixture.** Issue #165, split out of #152 so the gate itself could be reviewed in
    # one pass.
    #
    # ## Why a second job rather than three more legs on the one above
    #
    # Because the one above must not grow. Issue #152's out-of-scope bullet 2 says the long
    # fixture "must not block PRs", and a matrix leg cannot be skipped by event without the runner
    # still starting, checking out and installing a JDK - which is wall time a pull request would
    # pay for a leg that does nothing. The `if:` here is on the *job*, so a pull request never
    # allocates a runner for it at all.
    #
    # This file's own opening comment settles the other half: later epics "add jobs or matrix legs
    # here"; they do not create a second workflow. So a second block in this file, and not a
    # reusable workflow.
    #
    # ## What is different, and what deliberately is not
    #
    # One thing: `-Pudea.replay.fixture`. `moba-36000.udearep` is ten times the recording the
    # gate replays, checked in beside it and reconciled by the same `--update-replay-fixtures`
    # that reconciles that one - see `MobaReplayFixturesCurrentTest`. Everything else - the two
    # operating systems, the second JVM vendor, the digest format, the join - is identical,
    # because the question it asks is identical and only the length of the answer differs.
    #
    # It replays `moba` too, and that is issue #172 rather than #165. Leaving the *more sensitive*
    # gate aimed at the world written to be deterministic would have been the wrong half to move:
    # ten minutes of simulated play is exactly where a drift too small to shift the world hash
    # inside a minute has a chance to surface.
    #
    # There is no `plant: true` leg here. The plant proves the gate can fail, and it is proven on
    # every push by the job above and by `:moba:udeaReplayEqualityProof`; carrying it here as well
    # would buy nothing and would make the "exactly one leg" fence a fence over two jobs' worth of
    # legs.
    #
    # ## Measured, on the run this job's leg-time step prints
    #
    # The wall times per leg are in each run's job summary, unconditionally, so the figure to read
    # is that run's rather than one written down here. What is worth writing down is the shape,
    # because it is what makes the length affordable: a leg's wall time is checkout, JDK setup and
    # the Gradle build, and the replay disappears into it.
    #
    # The replay's own cost, measured locally on one machine at `moba-3600` and `moba-36000`:
    # 1918ms for 3600 ticks and 14940ms for 36000, both single samples on an idle-ish box. So the
    # nightly's extra thirteen seconds sit on top of a leg the gate already budgets 240s for.
    #
    # What the length does add is artefact. A 36000-tick `moba` digest stream is 19,533,419 bytes
    # against the gate fixture's 2,326,497, so one nightly run uploads 55.9MiB across its three
    # legs at the same seven-day retention - against 47.1MiB when this job replayed `drift-36000`.
    # That is the number to revisit if the storage bill ever matters, and `retention-days` below is
    # the lever.
    name: replay-equality-nightly (${{ matrix.os }}, ${{ matrix.distribution }})
    # Never on a pull request. `workflow_dispatch` is here so the job can be proven to run without
    # waiting a day for the cron; it is how issue #165's own evidence was produced.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/example')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distribution: temurin
            vendor: Adoptium
          - os: windows-latest
            distribution: temurin
            vendor: Adoptium
          - os: ubuntu-latest
            distribution: corretto
            vendor: Amazon
    steps:
      - name: Start the nightly clock
        id: clock
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Replay the 36000-tick moba fixture and write this leg's digest
        shell: bash
        run: >-
          ./gradlew :moba:udeaReplayDigest
          -Pudea.replay.fixture=moba-36000.udearep
          -Pudea.replay.label=nightly/${{ matrix.os }}/${{ matrix.distribution }}-17
          -Pudea.replay.jvmVendor=${{ matrix.vendor }}
          -Pudea.replay.out=nightly-digests/${{ matrix.os }}-${{ matrix.distribution }}.udeaeq
          --stacktrace

      - name: Upload this nightly leg's digest stream
        uses: actions/upload-artifact@v4
        with:
          name: replay-nightly-digest-${{ matrix.os }}-${{ matrix.distribution }}
          path: nightly-digests/*.udeaeq
          if-no-files-found: error
          retention-days: 7

      - name: Report this nightly leg's wall time
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - ${{ steps.clock.outputs.started }} ))
          echo "| nightly ${{ matrix.os }} / ${{ matrix.distribution }}-17 | ${elapsed}s |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "replay-equality-nightly leg wall time: ${elapsed}s"

  replay-equality-nightly-join:
    # The nightly verdict. The same shape as `replay-equality-join`, and separate for the same
    # reason the legs are: it must not exist on a pull request, and a job cannot be half-skipped.
    #
    # `always()` guarded by the legs' result, so a red leg still produces a verdict naming which
    # leg failed to produce a stream. `ReplayEqualsMain` exits 2 for that and 1 for a real
    # divergence, and collapsing the two would report a broken runner as a determinism defect.
    name: replay-equality-nightly (join)
    runs-on: ubuntu-latest
    needs: replay-equality-nightly
    if: >-
      always() &&
      needs.replay-equality-nightly.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Download every nightly leg's digest
        uses: actions/download-artifact@v4
        with:
          pattern: replay-nightly-digest-*
          path: nightly-digests
          merge-multiple: true

      - name: Compare every nightly leg
        shell: bash
        run: >-
          ./gradlew :udea-replay:udeaReplayEquals
          -Pudea.replay.streams=nightly-digests
          --stacktrace

      # The verdict, and with it the block `ReplayBisectGuide` renders: the exact `./gradlew` line
      # that replays this fixture on one machine, and the `replay.*` loop that walks into the
      # divergence. Rendered by a tested class rather than assembled here, for the reason the job
      # above gives about anything expressed only in this file.
      - name: Publish the nightly verdict and how to reproduce it
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary=udea-replay/build/reports/udea/replay-equality/summary.md
          {
            echo "## replay-equality-nightly"
            echo
            echo '```'
            cat "$summary" 2>/dev/null || echo "no summary was produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the nightly verdict and the digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-equality-nightly-verdict
          path: |
            udea-replay/build/reports/udea/replay-equality/**
            nightly-digests/*.udeaeq
          if-no-files-found: error
          retention-days: 7
