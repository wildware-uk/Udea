# udea net-components.lock — THE COMPONENT TYPE ID SPACE.
#
# Every `@Replicated` component in the build, sorted. A component's position in this list is
# its `ComponentTypeId`, and that id is on the wire in every packet and in every recorded
# replay, so inserting a name renumbers its successors and breaks both.
#
# Why a file and not a scan: a KSP run only ever sees one Gradle module. A processor that
# numbers the symbols in front of it hands out 0, 1, 2, … *per module*, so two modules both
# mint ComponentTypeId(0) and two peers decode each other's packets as the wrong component
# type — silently, because each module's net-protocol.lock is internally consistent and the
# connect-time protoHash therefore reports agreement. Spec 5 puts every id in one sorted-FQN
# assignment; the build hands that list to every module as `udea.projectComponents`.
#
# Adding a `@Replicated` component without adding it here is a build failure at the symbol.
# That failure is the point: an id is a promise to every client and every replay, so it is
# made in a reviewed diff rather than by a processor counting what it happened to be shown.
#
# Names may be listed before the component exists. Ids come from every name in the space,
# including a component that currently fails to compile, so that one broken component cannot
# renumber all of its successors on the wire while somebody fixes it.
#
# Today the only source set contributing components is udea-codegen's own fixture source set,
# which is what exercises the generator end to end (issue #29). moba and udea-gas add their
# names here as they gain components.
#
# udea-gas's three components - Attributes, Abilities and GameplayEffects - are deliberately
# NOT here, and that is a statement rather than an omission: each is a variable-length array of
# records, which `FieldLowering` refuses, so none of them can carry `@Replicated` at all. Their
# codecs are hand-written (`AttributesReplicator`, `AbilitiesReplicator`,
# `GameplayEffectsReplicator`) and take the id their caller passes, defaulting to 64, 65 and 66 -
# above this space, so they cannot collide with a name here until this file reaches sixty-five
# entries, at which point `ComponentRegistry` refuses the duplicate loudly at boot. They join
# this list when they are generated rather than written.
#
# `dev.wildware.moba.CharacterView` moved every later id by one when it was added. It had been
# left out on purpose - minting protocol identity is a wire decision, not a renderer's - and the
# measured cost of leaving it out was that a rewind resurrected dead units as bare
# Position+GameUnit shells with no art and no combat state. Nothing has shipped against the old
# numbering, so no recorded replay and no connected client decodes with it.
#
# `dev.wildware.moba.match.MatchState` and `dev.wildware.moba.match.Respawn` are the game
# loop: which match this is, who is left on each side, who won, the tick it was decided on,
# the seed its level was laid out from, and the timer a dead player stands back up on. They
# are here because match state has to survive a `time.rewind`, and a component outside this
# space is invisible to capture rather than partly captured - the cost the CharacterView note
# above measured. Both names sort between `level.GameUnit` and the codegen fixtures, so the
# only ids that moved are the fixture ones, and nothing has ever shipped against those.
