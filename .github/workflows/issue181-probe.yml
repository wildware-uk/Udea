# TEMPORARY - issue #181 measurement probe, round 3 (round 2's planted legs, fixed for explicit API mode). Deleted before the branch is handed over.
#
# Round 1 (run 35110741713) showed the first clean build is ~75% warm-up and that runners come
# in two CPU types. This round measures the candidate protocol: two checkouts in one job, warmed,
# then ABBA-ordered clean builds with the configuration cache entry removed before each sample.
# `plant` is the number of generated functions added to udea-core in the HEAD copy only: 0 is
# identical work (the noise), anything else is a genuine extra compile (the signal).
name: issue181-probe

on:
  push:
    branches: [issue-181-clean-build-budget]

jobs:
  probe:
    name: probe leg ${{ matrix.leg }} plant ${{ matrix.plant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: 6, plant: 1500 }
          - { leg: 7, plant: 3000 }
          - { leg: 8, plant: 6000 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Machine
        shell: bash
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo
      - name: Measure
        shell: bash
        env:
          PLANT: ${{ matrix.plant }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          cp -r . ../base
          if [ "$PLANT" -gt 0 ]; then
            f=udea-core/src/main/kotlin/dev/wildware/udea/core/Planted181.kt
            echo "package dev.wildware.udea.core" > $f
            for n in $(seq 1 "$PLANT"); do
              echo "internal fun planted$n(x: Int): Int = (x * 31 + $n) xor (x shr 3) + listOf(x, $n).sum()" >> $f
            done
          fi
          measure() { # label dir
            rm -rf "$2/.gradle/configuration-cache"
            start=$(date +%s%3N)
            (cd "$2" && ./gradlew clean udeaAssemble --no-build-cache > /tmp/g.log 2>&1) || { tail -60 /tmp/g.log; exit 1; }
            end=$(date +%s%3N)
            echo "SAMPLE $1 $((end-start))"
          }
          ./gradlew help -q > /dev/null
          (cd ../base && ./gradlew help -q > /dev/null)
          measure warm-head .
          measure warm-base ../base
          measure warm-head .
          measure warm-base ../base
          for round in 1 2 3; do
            measure base ../base
            measure head .
            measure head .
            measure base ../base
          done
