# Which Udea to build against. Every engine coordinate and every engine plugin in this
# repository takes its version from here, so upgrading the engine is this one line.
#
# Until Udea's first release is on Maven Central this is a snapshot, and `mavenLocal()` in
# `settings.gradle.kts` is where it comes from: publish the engine with `./gradlew
# publishToMavenLocal` and `./gradlew -p build-logic publishToMavenLocal` in its checkout.
udeaVersion=0.1.0-SNAPSHOT

# The Kotlin compiler and KSP run in the Gradle worker JVM, and KSP2 holds the Kotlin Analysis
# API in metaspace. These are the engine's own numbers; a cold build fails without them.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

org.gradle.caching=true
org.gradle.parallel=true
